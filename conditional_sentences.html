<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Conditional Sentences</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --t0-bg:#0d9488;--t0-light:#ccfbf1;--t0-mid:#5eead4;--t0-text:#134e4a;
  --t1-bg:#2563eb;--t1-light:#dbeafe;--t1-mid:#93c5fd;--t1-text:#1e3a5f;
  --t2-bg:#d97706;--t2-light:#fef3c7;--t2-mid:#fcd34d;--t2-text:#78350f;
  --t3-bg:#dc2626;--t3-light:#fee2e2;--t3-mid:#fca5a5;--t3-text:#7f1d1d;
  --mx-bg:#7c3aed;--mx-light:#ede9fe;--mx-mid:#c4b5fd;--mx-text:#4c1d95;
}
body { font-family:'Source Serif 4',Georgia,serif; background:#f8fafc; min-height:100vh; -webkit-tap-highlight-color:transparent; }
.dm { font-family:'DM Sans',sans-serif; }
button { cursor:pointer; font-family:'DM Sans',sans-serif; }
input { font-family:'DM Sans',sans-serif; }

/* Header */
#app-header { padding:32px 24px 24px; color:#fff; transition:background 0.4s; }
#app-header h1 { font-size:28px; font-weight:900; letter-spacing:-0.5px; }
#app-header p { font-size:15px; opacity:0.85; margin-top:4px; }

/* Tabs */
.tab-bar { display:flex; overflow-x:auto; background:#fff; border-bottom:2px solid #e5e7eb; -webkit-overflow-scrolling:touch; }
.tab-bar button { flex:none; padding:12px 18px; border:none; border-bottom:3px solid transparent; background:transparent; color:#6b7280; font-weight:500; font-size:14px; white-space:nowrap; transition:all 0.2s; }
.tab-bar button.active { font-weight:700; }

/* Content */
.content { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
.section-title { font-size:22px; font-weight:900; margin-bottom:4px; }
.section-sub { font-size:15px; color:#6b7280; margin-bottom:0; }
.formula-box { border-radius:12px; padding:16px 20px; margin:16px 0 20px; }
.formula-box .formula { font-weight:700; font-size:16px; }
.formula-box .uz { font-size:14px; opacity:0.8; margin-top:4px; }
.examples-label { font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:#9ca3af; margin-bottom:8px; }
.example-item { padding:10px 16px; background:#fff; border-radius:8px; border:1px solid #e5e7eb; margin-bottom:6px; font-size:15px; }
.example-item .if-part { font-weight:600; }

/* Exercise tabs */
.ex-tabs { display:flex; gap:8px; margin:20px 0; flex-wrap:wrap; }
.ex-tabs button { padding:8px 18px; border-radius:8px; border:2px solid #d1d5db; background:#fff; color:#374151; font-weight:600; font-size:14px; transition:all 0.15s; }
.ex-tabs button.active { color:#fff; }

/* Exercise card */
.exercise-card { background:#f9fafb; border-radius:14px; padding:20px; }
.exercise-card h3 { font-size:18px; font-weight:700; margin-bottom:4px; }
.exercise-card .instruction { font-size:14px; color:#6b7280; margin-bottom:16px; }

/* Items */
.item-card { padding:14px 18px; background:#fff; border-radius:10px; border:1px solid #e5e7eb; margin-bottom:12px; }
.item-num { font-weight:700; margin-right:8px; }
.gap-input { padding:4px 8px; margin:0 4px; border-radius:6px; font-size:inherit; outline:none; transition:border-color 0.2s; border-width:2px; border-style:solid; display:inline-block; min-width:100px; }
.gap-input:focus { box-shadow:0 0 0 2px rgba(0,0,0,0.08); }
.correction-text { font-size:13px; margin-top:6px; }
.correction-text.wrong { color:#ef4444; }
.correction-text.right { color:#22c55e; }

/* Match */
.match-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:500px){ .match-grid { grid-template-columns:1fr; } }
.match-col-label { font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.match-btn { padding:10px 14px; border-radius:8px; border:2px solid #d1d5db; background:#fff; text-align:left; font-size:14px; line-height:1.5; transition:all 0.15s; width:100%; margin-bottom:6px; }
.match-btn:disabled { cursor:default; }

/* MC grid */
.mc-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
@media(max-width:500px){ .mc-grid { grid-template-columns:1fr; } }
.mc-btn { padding:8px 12px; border-radius:8px; border:2px solid #d1d5db; background:#f9fafb; text-align:left; font-size:15px; transition:all 0.15s; }

/* Type ID pills */
.type-pills { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.type-pill { padding:6px 16px; border-radius:20px; border:2px solid #d1d5db; background:#f9fafb; font-weight:600; font-size:13px; transition:all 0.15s; }

/* Error correction */
.wrong-sentence { color:#ef4444; text-decoration:line-through; text-decoration-color:#fca5a5; }
.hint-btn { font-size:12px; border:none; padding:4px 10px; border-radius:12px; cursor:pointer; white-space:nowrap; }
.hint-text { font-size:13px; color:#6b7280; font-style:italic; margin:6px 0 8px; }
.ec-input { width:100%; padding:8px 12px; border:2px solid #d1d5db; border-radius:8px; font-size:15px; }

/* Buttons */
.btn-primary { padding:10px 24px; border-radius:8px; border:none; color:#fff; font-weight:700; font-size:15px; transition:opacity 0.15s; }
.btn-secondary { padding:10px 20px; border-radius:8px; border:1px solid #d1d5db; background:#fff; color:#374151; font-weight:600; font-size:14px; }
.btn-row { margin-top:20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.score { font-weight:700; font-size:18px; }

/* Nav */
.nav-row { display:flex; justify-content:space-between; margin-top:28px; }
.nav-btn { padding:10px 20px; border-radius:8px; font-weight:600; font-size:14px; }
.nav-prev { border:1px solid #d1d5db; background:#fff; color:#374151; }
.nav-next { border:none; color:#fff; }
.nav-btn:disabled { opacity:0.4; cursor:default; }

/* Corrections panel */
.corrections-panel { margin-top:12px; padding:12px; background:#fef2f2; border-radius:8px; font-size:14px; }
.corrections-panel strong { display:block; margin-bottom:4px; }
.corrections-panel div { margin-top:4px; }

/* Translation reveal */
.translation-row { margin-top:10px; }
.reveal-btn { padding:6px 14px; border-radius:6px; border:1px solid #d1d5db; background:#fff; font-size:13px; font-weight:600; color:#6b7280; transition:all 0.15s; }
.reveal-btn:hover { background:#f3f4f6; }
.translation-answer { margin-top:8px; padding:10px 14px; border-radius:8px; font-size:15px; line-height:1.5; border-left:3px solid; }
.uz-sentence { font-size:17px; line-height:1.6; margin-bottom:10px; }
</style>
</head>
<body>

<div id="app-header">
  <h1>Conditional Sentences</h1>
  <p class="dm">Interactive exercises — Types 0, 1, 2, 3 &amp; Mixed</p>
</div>

<div class="tab-bar" id="tab-bar"></div>

<div class="content" id="content"></div>

<script>
/* ═══════════════════════════════════════
   DATA
   ═══════════════════════════════════════ */
var COLORS = {
  0:{bg:'#0d9488',light:'#ccfbf1',mid:'#5eead4',text:'#134e4a'},
  1:{bg:'#2563eb',light:'#dbeafe',mid:'#93c5fd',text:'#1e3a5f'},
  2:{bg:'#d97706',light:'#fef3c7',mid:'#fcd34d',text:'#78350f'},
  3:{bg:'#dc2626',light:'#fee2e2',mid:'#fca5a5',text:'#7f1d1d'},
  mix:{bg:'#7c3aed',light:'#ede9fe',mid:'#c4b5fd',text:'#4c1d95'}
};

var SECTIONS = [
  {
    id:0, title:'Type 0 — Zero Conditional', subtitle:'General truths & facts',
    formula:'If + Present Simple → Present Simple',
    uz:'Har doim to\'g\'ri bo\'lgan haqiqatlar uchun ishlatiladi.',
    examples:[
      {if:'If you heat water to 100°C,',then:'it boils.'},
      {if:'If plants don\'t get water,',then:'they die.'}
    ],
    exercises:[
      {
        type:'gapfill', title:'Fill in the Gaps',
        instruction:'Type the correct present simple form of the verb in brackets.',
        items:[
          {s:'If you ___ (mix) red and yellow, you ___ (get) orange.', a:[['mix'],['get']]},
          {s:'If ice ___ (fall) into water, it ___ (float).', a:[['falls'],['floats']]},
          {s:'If babies ___ (be) hungry, they ___ (cry).', a:[['are'],['cry']]},
          {s:'If you ___ (not sleep) enough, you ___ (feel) tired.', a:[["don't sleep","do not sleep"],['feel']]},
          {s:'If metal ___ (get) hot, it ___ (expand).', a:[['gets'],['expands']]}
        ]
      },
      {
        type:'match', title:'Match the Halves',
        instruction:'Click an if-clause, then click its matching result.',
        pairs:[
          {l:'If you heat water to 100°C,', r:'you see it start to boil.'},
          {l:'If you freeze water,', r:'you get ice.'},
          {l:'If you don\'t eat breakfast,', r:'you feel hungry by noon.'},
          {l:'If you mix red and blue,', r:'you get purple.'},
          {l:'If you exercise regularly,', r:'you sleep better at night.'}
        ]
      }
    ]
  },
  {
    id:1, title:'Type 1 — First Conditional', subtitle:'Real & likely future situations',
    formula:'If + Present Simple → will + base verb',
    uz:'Kelajakda sodir bo\'lishi mumkin bo\'lgan haqiqiy vaziyatlar uchun.',
    examples:[
      {if:'If it rains tomorrow,',then:'I will stay at home.'},
      {if:'If you study hard,',then:'you will pass the exam.'}
    ],
    exercises:[
      {
        type:'gapfill', title:'Fill in the Gaps',
        instruction:'Use present simple in the if-clause and will + base verb in the result clause.',
        items:[
          {s:'If it ___ (rain) tomorrow, we ___ (cancel) the picnic.', a:[['rains'],["will cancel","'ll cancel"]]},
          {s:'If she ___ (not study), she ___ (fail) the test.', a:[["doesn't study","does not study"],["will fail","'ll fail"]]},
          {s:'If you ___ (eat) that, you ___ (feel) sick.', a:[['eat'],["will feel","'ll feel"]]},
          {s:'If they ___ (arrive) late, they ___ (miss) the bus.', a:[['arrive'],["will miss","'ll miss"]]},
          {s:'If I ___ (see) Aziz, I ___ (tell) him the news.', a:[['see'],["will tell","'ll tell"]]}
        ]
      },
      {
        type:'mc', title:'Choose the Correct Completion',
        instruction:'Select the answer that correctly completes the first conditional sentence.',
        items:[
          {stem:'If we leave now, we _____ on time.', opts:['will arrive','would arrive','arrived','arrive'], c:0},
          {stem:'If she _____ the job, she\'ll move to Tashkent.', opts:['would get','will get','gets','got'], c:2},
          {stem:'If you don\'t hurry, you _____ the train.', opts:['missed','would miss','will miss','miss'], c:2},
          {stem:'If it _____ sunny, we\'ll go to the park.', opts:['will be','is','was','would be'], c:1},
          {stem:'They won\'t come if you _____ them.', opts:["won't invite","wouldn't invite","don't invite","didn't invite"], c:2}
        ]
      }
    ]
  },
  {
    id:2, title:'Type 2 — Second Conditional', subtitle:'Unreal / imaginary present',
    formula:'If + Past Simple → would + base verb',
    uz:'Hozirda haqiqiy bo\'lmagan, xayoliy vaziyatlar uchun. "be" fe\'li uchun "were" ishlatiladi.',
    examples:[
      {if:'If I had a million dollars,',then:'I would travel the world.'},
      {if:'If I were you,',then:'I would study harder.'}
    ],
    exercises:[
      {
        type:'gapfill', title:'Fill in the Gaps',
        instruction:'Use past simple in the if-clause and would + base verb in the result. Remember: use \'were\' for all subjects with \'be\'.',
        items:[
          {s:'If I ___ (be) rich, I ___ (buy) a big house.', a:[['were','was'],["would buy","'d buy"]]},
          {s:'If she ___ (have) more free time, she ___ (learn) to play guitar.', a:[['had'],["would learn","'d learn"]]},
          {s:'If we ___ (live) in London, we ___ (speak) English every day.', a:[['lived'],["would speak","'d speak"]]},
          {s:'If he ___ (not be) so lazy, he ___ (get) better grades.', a:[["weren't","wasn't","were not","was not"],["would get","'d get"]]},
          {s:'If I ___ (know) the answer, I ___ (tell) you.', a:[['knew'],["would tell","'d tell"]]}
        ]
      },
      {
        type:'error', title:'Find and Fix the Error',
        instruction:'Each sentence has ONE grammar mistake. Type the corrected sentence.',
        items:[
          {w:'If I will be a bird, I would fly to Samarkand.', c:['If I were a bird, I would fly to Samarkand.','If I was a bird, I would fly to Samarkand.'], h:'Check the if-clause verb form.'},
          {w:'If she has more money, she would buy a car.', c:['If she had more money, she would buy a car.'], h:'Is this a real or imaginary situation?'},
          {w:'If they lived here, they will visit us every day.', c:['If they lived here, they would visit us every day.'], h:'Check the result clause.'},
          {w:'If I were the president, I will build more schools.', c:['If I were the president, I would build more schools.'], h:'The result clause needs \'would\', not \'will\'.'},
          {w:'If he would study harder, he would pass.', c:['If he studied harder, he would pass.'], h:'Don\'t use \'would\' in the if-clause.'}
        ]
      }
    ]
  },
  {
    id:3, title:'Type 3 — Third Conditional', subtitle:'Unreal past / regrets',
    formula:'If + Past Perfect → would have + past participle',
    uz:'O\'tmishda sodir bo\'lmagan vaziyatlar haqida gapirish uchun. Ko\'pincha pushaymonlik ma\'nosini ifodalaydi.',
    examples:[
      {if:'If I had studied harder,',then:'I would have passed the exam.'},
      {if:'If she had left earlier,',then:'she wouldn\'t have missed the bus.'}
    ],
    exercises:[
      {
        type:'gapfill', title:'Fill in the Gaps',
        instruction:'Use past perfect (had + past participle) in the if-clause and would have + past participle in the result.',
        items:[
          {s:'If I ___ (know) about the party, I ___ (come).', a:[['had known'],["would have come","would've come"]]},
          {s:'If they ___ (leave) earlier, they ___ (not miss) the flight.', a:[['had left'],["wouldn't have missed","would not have missed"]]},
          {s:'If she ___ (study) medicine, she ___ (become) a doctor.', a:[['had studied'],["would have become","would've become"]]},
          {s:'If we ___ (not eat) so much, we ___ (not feel) sick.', a:[["hadn't eaten","had not eaten"],["wouldn't have felt","would not have felt"]]},
          {s:'If he ___ (be) more careful, he ___ (not break) his phone.', a:[['had been'],["wouldn't have broken","would not have broken"]]}
        ]
      },
      {
        type:'match', title:'Match the Halves',
        instruction:'Click an if-clause, then click its matching result.',
        pairs:[
          {l:'If she had woken up earlier,', r:'she wouldn\'t have been late for school.'},
          {l:'If she had taken the medicine,', r:'she would have felt better.'},
          {l:'If she had saved more money,', r:'she would have bought a new phone.'},
          {l:'If she had listened to the teacher,', r:'she would have understood the lesson.'},
          {l:'If she hadn\'t eaten the old bread,', r:'she wouldn\'t have gotten sick.'}
        ]
      }
    ]
  },
  {
    id:'mix', title:'Mixed — Translate & Identify', subtitle:'Read in Uzbek, identify the type, then check the translation',
    formula:'Type 0 / 1 / 2 / 3',
    uz:'Gaplarni o\'qing, har bir gapning turini aniqlang, so\'ng inglizcha tarjimasini tekshiring.',
    examples:[],
    exercises:[
      {
        type:'identify', title:'Translate & Identify the Type',
        instruction:'Each sentence is in Uzbek. Choose the conditional type, then reveal the English translation to check your work. TIP: Type 2 and Type 3 look identical in the if-clause. The result clause decides: "-ardim / -ardi" = Type 2, "-gan bo\'lardi" = Type 3.',
        items:[
          {uz:'Agar shokoladni qizdirsangiz, u eriydi.', en:'If you heat chocolate, it melts.', a:0},
          {uz:'Agar ertaga yomg\'ir yog\'sa, men soyabon olib chiqaman.', en:'If it rains tomorrow, I\'ll take an umbrella.', a:1},
          {uz:'Agar men novcharoq bo\'lganimda, basketbol o\'ynardim.', en:'If I were taller, I would play basketball.', a:2},
          {uz:'Agar Nilufar ko\'proq o\'qiganida, imtihondan o\'tgan bo\'lardi.', en:'If Nilufar had studied harder, she would have passed.', a:3},
          {uz:'Agar Ctrl+Z tugmalarini bossangiz, u oxirgi amalingizni bekor qiladi.', en:'If you press Ctrl+Z, it undoes your last action.', a:0},
          {uz:'Agar hozir chiqmasak, poyezddan qolamiz.', en:'If we don\'t leave now, we\'ll miss the train.', a:1},
          {uz:'Agar menda vaqt mashinasi bo\'lganda, Buyuk Ipak yo\'liga borardim.', en:'If I had a time machine, I would visit the Silk Road.', a:2},
          {uz:'Agar ular o\'z vaqtida kelganlarida, yig\'ilishni o\'tkazib yubormagan bo\'lardilar.', en:'If they had arrived on time, they wouldn\'t have missed the meeting.', a:3},
          {uz:'Agar gullarni sug\'ormasangiz, ular so\'lib qoladi.', en:'If you don\'t water flowers, they wilt.', a:0},
          {uz:'Agar Aziz sizning raqamingizni bilganida, sizga qo\'ng\'iroq qilgan bo\'lardi.', en:'If Aziz had known your number, he would have called you.', a:3}
        ]
      }
    ]
  }
];

/* ═══════════════════════════════════════
   STATE
   ═══════════════════════════════════════ */
var activeSection = 0;
var activeExercise = 0;
// per-exercise state stored by key "sectionIdx-exerciseIdx"
var exState = {};

function getColor(sec) { return COLORS[sec.id]; }
function norm(s) { return s.toLowerCase().replace(/['']/g,"'").replace(/\s+/g,' ').trim(); }
function normNoPunc(s) { return norm(s).replace(/[.,!?]/g,''); }
function shuffleArr(a) { var b=a.slice(); for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;} return b; }

function getExState(si, ei) {
  var k = si+'-'+ei;
  if (!exState[k]) exState[k] = {};
  return exState[k];
}
function resetExState(si, ei) {
  exState[si+'-'+ei] = {};
}

/* ═══════════════════════════════════════
   RENDER
   ═══════════════════════════════════════ */
function render() {
  var sec = SECTIONS[activeSection];
  var c = getColor(sec);

  // Header
  var hdr = document.getElementById('app-header');
  hdr.style.background = 'linear-gradient(135deg,'+c.bg+' 0%,'+c.text+' 100%)';

  // Tabs
  var tabBar = document.getElementById('tab-bar');
  tabBar.innerHTML = '';
  SECTIONS.forEach(function(s,i) {
    var sc = getColor(s);
    var btn = document.createElement('button');
    btn.textContent = s.id === 'mix' ? 'Mixed' : 'Type '+s.id;
    btn.className = i===activeSection ? 'dm active' : 'dm';
    if (i===activeSection) {
      btn.style.borderBottomColor = sc.bg;
      btn.style.background = sc.light;
      btn.style.color = sc.bg;
    }
    btn.onclick = function() { activeSection=i; activeExercise=0; render(); };
    tabBar.appendChild(btn);
  });

  // Content
  var content = document.getElementById('content');
  var html = '';

  // Section header
  html += '<h2 class="section-title" style="color:'+c.bg+'">'+sec.title+'</h2>';
  html += '<p class="section-sub dm">'+sec.subtitle+'</p>';

  // Formula box
  html += '<div class="formula-box" style="background:'+c.light+';border:1px solid '+c.mid+'">';
  html += '<div class="formula dm" style="color:'+c.text+'">📐 '+sec.formula+'</div>';
  html += '<div class="uz dm" style="color:'+c.text+'">🇺🇿 '+sec.uz+'</div>';
  html += '</div>';

  // Examples
  if (sec.examples.length) {
    html += '<div class="examples-label dm">Examples</div>';
    sec.examples.forEach(function(ex) {
      html += '<div class="example-item dm"><span class="if-part" style="color:'+c.bg+'">'+ex.if+'</span> '+ex.then+'</div>';
    });
  }

  // Exercise tabs
  if (sec.exercises.length > 1) {
    html += '<div class="ex-tabs">';
    sec.exercises.forEach(function(ex,i) {
      var cls = i===activeExercise ? 'active' : '';
      var style = i===activeExercise ? 'background:'+c.bg+';border-color:'+c.bg+';color:#fff' : '';
      html += '<button class="'+cls+'" style="'+style+'" onclick="activeExercise='+i+';render()">'+ex.title+'</button>';
    });
    html += '</div>';
  }

  // Exercise card
  var ex = sec.exercises[activeExercise];
  html += '<div class="exercise-card" style="border:1px solid '+c.mid+'40">';
  html += '<h3 style="color:'+c.text+'">'+ex.title+'</h3>';
  html += '<p class="instruction dm">'+ex.instruction+'</p>';
  html += '<div id="exercise-body"></div>';
  html += '</div>';

  // Nav
  var isFirst = activeSection===0 && activeExercise===0;
  var isLast = activeSection===SECTIONS.length-1 && activeExercise===sec.exercises.length-1;
  html += '<div class="nav-row">';
  html += '<button class="nav-btn nav-prev dm" '+(isFirst?'disabled':'')+' onclick="navPrev()">← Previous</button>';
  html += '<button class="nav-btn nav-next dm" style="background:'+(isLast?'#d1d5db':c.bg)+'" '+(isLast?'disabled':'')+' onclick="navNext()">Next →</button>';
  html += '</div>';

  content.innerHTML = html;

  // Render exercise body
  renderExercise(ex, c, activeSection, activeExercise);
}

function navPrev() {
  if (activeExercise > 0) activeExercise--;
  else if (activeSection > 0) { activeSection--; activeExercise = SECTIONS[activeSection].exercises.length-1; }
  render();
}
function navNext() {
  var sec = SECTIONS[activeSection];
  if (activeExercise < sec.exercises.length-1) activeExercise++;
  else if (activeSection < SECTIONS.length-1) { activeSection++; activeExercise=0; }
  render();
}

/* ═══════════════════════════════════════
   EXERCISE RENDERERS
   ═══════════════════════════════════════ */
function renderExercise(ex, c, si, ei) {
  switch(ex.type) {
    case 'gapfill': renderGapFill(ex, c, si, ei); break;
    case 'match': renderMatch(ex, c, si, ei); break;
    case 'mc': renderMC(ex, c, si, ei); break;
    case 'error': renderError(ex, c, si, ei); break;
    case 'identify': renderIdentify(ex, c, si, ei); break;
  }
}

/* ── Gap Fill ── */
function renderGapFill(ex, c, si, ei) {
  var st = getExState(si,ei);
  if (!st.inputs) st.inputs = ex.items.map(function(it){ return it.a.map(function(){return '';}); });
  if (!st.checked) st.checked = false;
  if (!st.results) st.results = null;

  var body = document.getElementById('exercise-body');
  var html = '';

  ex.items.forEach(function(item, qi) {
    html += '<div class="item-card" style="font-size:16px;line-height:2.2">';
    html += '<span class="item-num" style="color:'+c.bg+'">'+(qi+1)+'.</span>';
    var parts = item.s.split('___');
    parts.forEach(function(part, pi) {
      html += '<span>'+part+'</span>';
      if (pi < parts.length-1) {
        var val = st.inputs[qi][pi];
        var borderColor = st.checked ? (st.results[qi][pi] ? '#22c55e' : '#ef4444') : c.mid;
        var bg = st.checked ? (st.results[qi][pi] ? '#f0fdf4' : '#fef2f2') : '#fff';
        html += '<input class="gap-input" type="text" data-qi="'+qi+'" data-pi="'+pi+'" value="'+escAttr(val)+'" '+(st.checked?'disabled':'')+' style="border-color:'+borderColor+';background:'+bg+';width:'+Math.max(120,(val.length||8)*11)+'px" placeholder="...">';
      }
    });
    if (st.checked && !st.results[qi].every(Boolean)) {
      html += '<div class="correction-text right">✓ Correct: '+item.a.map(function(x){return x[0];}).join(' / ')+'</div>';
    }
    html += '</div>';
  });

  // Buttons
  html += '<div class="btn-row">';
  if (!st.checked) {
    html += '<button class="btn-primary dm" style="background:'+c.bg+'" onclick="checkGapFill('+si+','+ei+')">Check Answers</button>';
  } else {
    var total = ex.items.reduce(function(s,it){return s+it.a.length;},0);
    var correct = st.results.reduce(function(s,r){return s+r.filter(Boolean).length;},0);
    var emoji = correct===total?'🎉':correct>=total/2?'👍':'💪';
    html += '<div class="score dm" style="color:'+c.bg+'">'+correct+'/'+total+' correct '+emoji+'</div>';
    html += '<button class="btn-primary dm" style="background:#6b7280" onclick="resetEx('+si+','+ei+')">Try Again</button>';
  }
  html += '</div>';

  body.innerHTML = html;

  // Attach input listeners
  body.querySelectorAll('.gap-input').forEach(function(inp) {
    inp.addEventListener('input', function() {
      var qi = parseInt(this.getAttribute('data-qi'));
      var pi = parseInt(this.getAttribute('data-pi'));
      st.inputs[qi][pi] = this.value;
      this.style.width = Math.max(120, (this.value.length||8)*11)+'px';
    });
  });
}

function checkGapFill(si, ei) {
  var ex = SECTIONS[si].exercises[ei];
  var st = getExState(si,ei);
  st.results = ex.items.map(function(item,qi) {
    return item.a.map(function(accepted,gi) {
      return accepted.some(function(a){ return norm(a)===norm(st.inputs[qi][gi]); });
    });
  });
  st.checked = true;
  render();
}

/* ── Match Halves ── */
function renderMatch(ex, c, si, ei) {
  var st = getExState(si,ei);
  if (!st.shuffled) st.shuffled = shuffleArr(ex.pairs.map(function(p,i){return {text:p.r, idx:i};}));
  if (st.selectedLeft===undefined) st.selectedLeft = null;
  if (!st.matches) st.matches = {};
  if (!st.checked) st.checked = false;
  if (!st.results) st.results = null;

  var body = document.getElementById('exercise-body');
  var html = '<div class="match-grid">';

  // Left column
  html += '<div>';
  html += '<div class="match-col-label dm" style="color:'+c.bg+'">If-clause</div>';
  ex.pairs.forEach(function(p,i) {
    var matched = st.matches[i] !== undefined;
    var selected = st.selectedLeft === i;
    var borderColor = '#d1d5db';
    var bg = '#fff';
    if (st.checked) {
      if (st.results[i]===true) { borderColor='#22c55e'; bg='#f0fdf4'; }
      else if (st.results[i]===false) { borderColor='#ef4444'; bg='#fef2f2'; }
    } else {
      if (selected) { borderColor=c.bg; bg=c.light; }
      else if (matched) { borderColor=c.mid; bg=c.light; }
    }
    html += '<button class="match-btn dm" style="border-color:'+borderColor+';background:'+bg+'" '+(st.checked||matched?'disabled':'')+' onclick="matchLeftClick('+si+','+ei+','+i+')">'+p.l+'</button>';
  });
  html += '</div>';

  // Right column
  html += '<div>';
  html += '<div class="match-col-label dm" style="color:'+c.bg+'">Result</div>';
  st.shuffled.forEach(function(item,ri) {
    var matchEntry = null;
    Object.keys(st.matches).forEach(function(k){ if(st.matches[k]===ri) matchEntry=k; });
    var borderColor = '#d1d5db';
    var bg = '#fff';
    var opacity = '1';
    if (matchEntry !== null) {
      if (st.checked) {
        if (st.results[matchEntry]) { borderColor='#22c55e'; bg='#f0fdf4'; }
        else { borderColor='#ef4444'; bg='#fef2f2'; }
      } else { borderColor=c.mid; bg=c.light; opacity='0.7'; }
    } else if (st.selectedLeft !== null) {
      borderColor = c.accent || c.bg;
    }
    html += '<button class="match-btn dm" style="border-color:'+borderColor+';background:'+bg+';opacity:'+opacity+'" '+(st.checked||matchEntry!==null?'disabled':'')+' onclick="matchRightClick('+si+','+ei+','+ri+')">'+item.text+'</button>';
  });
  html += '</div></div>';

  // Corrections
  if (st.checked) {
    var anyWrong = Object.keys(st.results).some(function(k){return !st.results[k];});
    if (anyWrong) {
      html += '<div class="corrections-panel"><strong>Correct pairs:</strong>';
      ex.pairs.forEach(function(p,i) {
        if (st.results[i]===false) html += '<div>'+p.l+' → '+p.r+'</div>';
      });
      html += '</div>';
    }
  }

  // Buttons
  var allMatched = Object.keys(st.matches).length === ex.pairs.length;
  html += '<div class="btn-row">';
  if (!st.checked) {
    html += '<button class="btn-primary dm" style="background:'+(allMatched?c.bg:'#9ca3af')+'" '+(allMatched?'':'disabled')+' onclick="checkMatch('+si+','+ei+')">Check Answers</button>';
  } else {
    var correct = Object.values(st.results).filter(Boolean).length;
    var emoji = correct===ex.pairs.length?'🎉':'💪';
    html += '<div class="score dm" style="color:'+c.bg+'">'+correct+'/'+ex.pairs.length+' correct '+emoji+'</div>';
    html += '<button class="btn-primary dm" style="background:#6b7280" onclick="resetEx('+si+','+ei+')">Try Again</button>';
  }
  html += '</div>';

  body.innerHTML = html;
}

function matchLeftClick(si, ei, i) {
  var st = getExState(si,ei);
  if (st.checked || st.matches[i]!==undefined) return;
  st.selectedLeft = st.selectedLeft===i ? null : i;
  render();
}

function matchRightClick(si, ei, ri) {
  var st = getExState(si,ei);
  if (st.checked || st.selectedLeft===null) return;
  var alreadyUsed = Object.values(st.matches).indexOf(ri) !== -1;
  if (alreadyUsed) return;
  st.matches[st.selectedLeft] = ri;
  st.selectedLeft = null;
  render();
}

function checkMatch(si, ei) {
  var ex = SECTIONS[si].exercises[ei];
  var st = getExState(si,ei);
  st.results = {};
  Object.keys(st.matches).forEach(function(li) {
    st.results[li] = st.shuffled[st.matches[li]].idx === parseInt(li);
  });
  st.checked = true;
  render();
}

/* ── Multiple Choice ── */
function renderMC(ex, c, si, ei) {
  var st = getExState(si,ei);
  if (!st.selected) st.selected = ex.items.map(function(){return null;});
  if (!st.checked) st.checked = false;

  var body = document.getElementById('exercise-body');
  var html = '';

  ex.items.forEach(function(item, qi) {
    html += '<div class="item-card">';
    html += '<div style="font-weight:600;font-size:16px;margin-bottom:10px"><span style="color:'+c.bg+';margin-right:8px">'+(qi+1)+'.</span>'+item.stem+'</div>';
    html += '<div class="mc-grid">';
    item.opts.forEach(function(opt, oi) {
      var isSel = st.selected[qi]===oi;
      var isCorr = item.c===oi;
      var bg='#f9fafb', border='#d1d5db';
      if (st.checked) {
        if (isCorr) { bg='#f0fdf4'; border='#22c55e'; }
        else if (isSel&&!isCorr) { bg='#fef2f2'; border='#ef4444'; }
      } else if (isSel) { bg=c.light; border=c.bg; }
      html += '<button class="mc-btn dm" style="border-color:'+border+';background:'+bg+'" '+(st.checked?'disabled':'')+' onclick="mcSelect('+si+','+ei+','+qi+','+oi+')">'+String.fromCharCode(97+oi)+') '+opt+'</button>';
    });
    html += '</div></div>';
  });

  html += '<div class="btn-row">';
  var allDone = st.selected.indexOf(null)===-1;
  if (!st.checked) {
    html += '<button class="btn-primary dm" style="background:'+(allDone?c.bg:'#9ca3af')+'" '+(allDone?'':'disabled')+' onclick="checkMC('+si+','+ei+')">Check Answers</button>';
  } else {
    var correct = ex.items.filter(function(it,qi){return st.selected[qi]===it.c;}).length;
    var emoji = correct===ex.items.length?'🎉':'💪';
    html += '<div class="score dm" style="color:'+c.bg+'">'+correct+'/'+ex.items.length+' correct '+emoji+'</div>';
    html += '<button class="btn-primary dm" style="background:#6b7280" onclick="resetEx('+si+','+ei+')">Try Again</button>';
  }
  html += '</div>';

  body.innerHTML = html;
}

function mcSelect(si,ei,qi,oi) {
  var st = getExState(si,ei);
  if (st.checked) return;
  st.selected[qi] = oi;
  render();
}

function checkMC(si,ei) {
  var st = getExState(si,ei);
  st.checked = true;
  render();
}

/* ── Error Correction ── */
function renderError(ex, c, si, ei) {
  var st = getExState(si,ei);
  if (!st.inputs) st.inputs = ex.items.map(function(){return '';});
  if (!st.checked) st.checked = false;
  if (!st.results) st.results = null;
  if (!st.hints) st.hints = ex.items.map(function(){return false;});

  var body = document.getElementById('exercise-body');
  var html = '';

  ex.items.forEach(function(item, i) {
    html += '<div class="item-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:8px">';
    html += '<div style="font-size:16px"><span class="item-num" style="color:'+c.bg+'">'+(i+1)+'.</span><span class="wrong-sentence">'+item.w+'</span></div>';
    if (!st.checked) {
      html += '<button class="hint-btn dm" style="background:'+c.light+';color:'+c.bg+'" onclick="toggleHint('+si+','+ei+','+i+')">'+(st.hints[i]?'Hide hint':'💡 Hint')+'</button>';
    }
    html += '</div>';
    if (st.hints[i] && !st.checked) {
      html += '<div class="hint-text dm">'+item.h+'</div>';
    }
    var borderColor = st.checked ? (st.results[i]?'#22c55e':'#ef4444') : '#d1d5db';
    var bg = st.checked ? (st.results[i]?'#f0fdf4':'#fef2f2') : '#fff';
    html += '<input class="ec-input dm" type="text" data-idx="'+i+'" value="'+escAttr(st.inputs[i])+'" '+(st.checked?'disabled':'')+' style="border-color:'+borderColor+';background:'+bg+'" placeholder="Type the corrected sentence...">';
    if (st.checked && !st.results[i]) {
      html += '<div class="correction-text right">✓ Correct: '+item.c[0]+'</div>';
    }
    html += '</div>';
  });

  html += '<div class="btn-row">';
  if (!st.checked) {
    html += '<button class="btn-primary dm" style="background:'+c.bg+'" onclick="checkError('+si+','+ei+')">Check Answers</button>';
  } else {
    var correct = st.results.filter(Boolean).length;
    var emoji = correct===ex.items.length?'🎉':'💪';
    html += '<div class="score dm" style="color:'+c.bg+'">'+correct+'/'+ex.items.length+' correct '+emoji+'</div>';
    html += '<button class="btn-primary dm" style="background:#6b7280" onclick="resetEx('+si+','+ei+')">Try Again</button>';
  }
  html += '</div>';

  body.innerHTML = html;

  body.querySelectorAll('.ec-input').forEach(function(inp) {
    inp.addEventListener('input', function() {
      st.inputs[parseInt(this.getAttribute('data-idx'))] = this.value;
    });
  });
}

function toggleHint(si,ei,i) {
  var st = getExState(si,ei);
  st.hints[i] = !st.hints[i];
  render();
}

function checkError(si,ei) {
  var ex = SECTIONS[si].exercises[ei];
  var st = getExState(si,ei);
  st.results = ex.items.map(function(item,i) {
    var n = normNoPunc(st.inputs[i]);
    return item.c.some(function(c){ return normNoPunc(c)===n; });
  });
  st.checked = true;
  render();
}

/* ── Identify Type (Uzbek-first with translation reveal) ── */
function renderIdentify(ex, c, si, ei) {
  var st = getExState(si,ei);
  if (!st.selected) st.selected = ex.items.map(function(){return null;});
  if (!st.checked) st.checked = false;
  if (!st.revealed) st.revealed = ex.items.map(function(){return false;});
  if (!st.translations) st.translations = ex.items.map(function(){return '';});

  var typeLabels = ['Type 0','Type 1','Type 2','Type 3'];
  var typeColors = [COLORS[0],COLORS[1],COLORS[2],COLORS[3]];

  var body = document.getElementById('exercise-body');
  var html = '';

  ex.items.forEach(function(item, qi) {
    html += '<div class="item-card">';
    // Uzbek sentence
    html += '<div class="uz-sentence"><span class="item-num" style="color:'+c.bg+'">'+(qi+1)+'.</span> 🇺🇿 <em>'+item.uz+'</em></div>';
    // Type pills
    html += '<div class="type-pills">';
    typeLabels.forEach(function(label, t) {
      var isSel = st.selected[qi]===t;
      var isCorr = item.a===t;
      var tc = typeColors[t];
      var bg='#f9fafb', border='#d1d5db', textColor='#374151';
      if (st.checked) {
        if (isCorr) { bg=tc.light; border=tc.bg; textColor=tc.text; }
        else if (isSel&&!isCorr) { bg='#fef2f2'; border='#ef4444'; textColor='#ef4444'; }
      } else if (isSel) { bg=tc.light; border=tc.bg; textColor=tc.text; }
      html += '<button class="type-pill dm" style="border-color:'+border+';background:'+bg+';color:'+textColor+'" '+(st.checked?'disabled':'')+' onclick="idSelect('+si+','+ei+','+qi+','+t+')">'+label+'</button>';
    });
    html += '</div>';
    // Translation input + reveal
    html += '<div class="translation-row">';
    html += '<div style="margin-top:10px"><label class="dm" style="font-size:13px;font-weight:600;color:#6b7280;display:block;margin-bottom:4px">Your translation:</label>';
    html += '<input class="ec-input dm tr-input" type="text" data-qi="'+qi+'" value="'+escAttr(st.translations[qi])+'" placeholder="Type the English translation here..." style="border-color:'+(st.revealed[qi]?c.mid:'#d1d5db')+'"></div>';
    if (st.revealed[qi]) {
      var tc = typeColors[item.a];
      html += '<div class="translation-answer" style="background:'+tc.light+';border-left-color:'+tc.bg+';color:'+tc.text+'">🇬🇧 '+item.en+'</div>';
    } else {
      html += '<div style="margin-top:8px"><button class="reveal-btn dm" onclick="revealTranslation('+si+','+ei+','+qi+')">Show Answer</button></div>';
    }
    html += '</div>';
    html += '</div>';
  });

  html += '<div class="btn-row">';
  var allDone = st.selected.indexOf(null)===-1;
  if (!st.checked) {
    html += '<button class="btn-primary dm" style="background:'+(allDone?c.bg:'#9ca3af')+'" '+(allDone?'':'disabled')+' onclick="checkIdentify('+si+','+ei+')">Check Answers</button>';
  } else {
    var correct = ex.items.filter(function(it,qi){return st.selected[qi]===it.a;}).length;
    var emoji = correct===ex.items.length?'🎉':'💪';
    html += '<div class="score dm" style="color:'+c.bg+'">'+correct+'/'+ex.items.length+' correct '+emoji+'</div>';
    html += '<button class="btn-primary dm" style="background:#6b7280" onclick="resetEx('+si+','+ei+')">Try Again</button>';
  }
  html += '</div>';

  body.innerHTML = html;

  // Attach translation input listeners
  body.querySelectorAll('.tr-input').forEach(function(inp) {
    inp.addEventListener('input', function() {
      st.translations[parseInt(this.getAttribute('data-qi'))] = this.value;
    });
  });
}

function revealTranslation(si,ei,qi) {
  var st = getExState(si,ei);
  st.revealed[qi] = true;
  render();
}

function idSelect(si,ei,qi,t) {
  var st = getExState(si,ei);
  if (st.checked) return;
  st.selected[qi] = t;
  render();
}

function checkIdentify(si,ei) {
  var st = getExState(si,ei);
  st.checked = true;
  render();
}

/* ── Reset ── */
function resetEx(si,ei) {
  resetExState(si,ei);
  render();
}

/* ── Utility ── */
function escAttr(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Init ── */
render();
</script>
</body>
</html>
