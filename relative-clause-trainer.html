<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relative Clause Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f4f3;
  --surface: #ffffff;
  --primary: #1a6b5a;
  --primary-light: #e8f5f0;
  --primary-dark: #0d4a3d;
  --accent: #e8853d;
  --accent-light: #fff3e8;
  --text: #1a2a25;
  --text-mid: #4a6560;
  --text-light: #7a9590;
  --border: #d4ddd9;
  --correct: #2d9e6f;
  --correct-bg: #e6f9f0;
  --wrong: #d45050;
  --wrong-bg: #fdeaea;
  --highlight: #ffe066;
  --highlight-border: #e6b800;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

button { cursor: pointer; font-family: inherit; border: none; outline: none; }
button * { pointer-events: none; }
input, textarea { font-family: inherit; outline: none; }

.header {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
  color: white;
  padding: 20px 20px 16px;
  position: relative;
}
.header h1 {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
.header-actions {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  display: flex; gap: 8px;
}
.btn-icon {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.15); color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: background 0.2s;
}
.btn-icon:hover { background: rgba(255,255,255,0.25); }
.btn-icon.dev-active { background: var(--accent); }

.tabs {
  display: flex; background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab {
  flex: 1; min-width: 0; padding: 14px 8px 12px; text-align: center;
  font-size: 12px; font-weight: 600; color: var(--text-light);
  background: none; border-bottom: 3px solid transparent;
  transition: all 0.2s; white-space: nowrap;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab .tab-progress {
  font-size: 10px; font-weight: 400; color: var(--text-light);
  display: block; margin-top: 2px;
}

.main { max-width: 640px; margin: 0 auto; padding: 16px; }

.exercise { display: none; }
.exercise.active { display: block; }

.exercise-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
}
.exercise-title {
  font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; color: var(--primary-dark);
}
.exercise-counter { font-size: 13px; color: var(--text-light); font-weight: 500; }

.card {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
  border: 1px solid var(--border); position: relative;
}
.card.completed { border-left: 4px solid var(--correct); }

.sentence-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--text-light); margin-bottom: 8px;
}
.sentence-type-badge {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 20px; margin-left: 8px; vertical-align: middle;
}
.badge-subject { background: #e8f0fe; color: #3367d6; }
.badge-object { background: #fce8e8; color: #c53929; }

/* Exercise 1: selectable sentence */
.selectable-sentence {
  font-size: 18px; line-height: 1.8; color: var(--text);
  margin: 14px 0; font-weight: 500; padding: 12px 14px;
  background: var(--primary-light); border-radius: var(--radius-sm);
  border: 2px solid transparent; user-select: text;
  -webkit-user-select: text;
}
.selectable-sentence mark {
  background: var(--highlight); padding: 2px 1px; border-radius: 3px;
  color: inherit; border-bottom: 2px solid var(--highlight-border);
}
.selectable-sentence mark.correct-mark {
  background: var(--correct-bg); border-bottom-color: var(--correct);
}
.highlight-instruction {
  font-size: 12px; color: var(--text-light); font-style: italic;
  margin-bottom: 6px;
}

.sentence-text {
  font-size: 17px; line-height: 1.6; color: var(--text);
  margin: 8px 0; font-weight: 500;
}

.translation-box {
  background: var(--primary-light); border-radius: var(--radius-sm);
  padding: 14px; margin-top: 12px; font-size: 15px; line-height: 1.5;
  color: var(--primary-dark); display: none;
}
.translation-box.visible { display: block; }

.input-group { margin: 12px 0; }
.input-group label {
  font-size: 12px; font-weight: 600; color: var(--text-light);
  text-transform: uppercase; letter-spacing: 0.3px; display: block; margin-bottom: 6px;
}
.text-input {
  width: 100%; padding: 12px 14px; font-size: 15px;
  border: 2px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text); transition: border-color 0.2s;
}
.text-input:focus { border-color: var(--primary); }

.answer-box {
  background: var(--correct-bg); border-radius: var(--radius-sm);
  padding: 14px; margin-top: 8px; font-size: 15px; color: #1a6b4a;
  line-height: 1.5; display: none; border-left: 3px solid var(--correct);
}
.answer-box.visible { display: block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; font-size: 14px; font-weight: 600;
  border-radius: var(--radius-sm); transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--primary-light); color: var(--primary); }
.btn-secondary:hover { background: #d5ede5; }
.btn-accent { background: var(--accent); color: white; }
.btn-accent:hover { background: #d6762e; }
.btn-outline { background: none; border: 2px solid var(--border); color: var(--text-mid); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

.self-assess {
  display: flex; gap: 8px; margin-top: 14px;
  padding-top: 14px; border-top: 1px solid var(--border);
}
.self-assess button {
  flex: 1; padding: 10px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600;
}
.btn-got-it { background: var(--correct-bg); color: var(--correct); border: 2px solid var(--correct); }
.btn-got-it:hover { background: #d0f0e0; }
.btn-not-quite { background: var(--wrong-bg); color: var(--wrong); border: 2px solid var(--wrong); }
.btn-not-quite:hover { background: #fcd8d8; }

.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.nav-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.nav-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--border); border: none; padding: 0; transition: all 0.2s;
}
.nav-dot.active { background: var(--primary); transform: scale(1.3); }
.nav-dot.done { background: var(--correct); }
.btn-nav {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--border);
  color: var(--text-mid); font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.btn-nav:hover { border-color: var(--primary); color: var(--primary); }
.btn-nav:disabled { opacity: 0.3; pointer-events: none; }

.audio-controls { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
.btn-play {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--primary); color: white; font-size: 22px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.btn-play:hover { background: var(--primary-dark); }
.speed-toggle { display: flex; border-radius: 20px; overflow: hidden; border: 2px solid var(--border); }
.speed-opt { padding: 6px 14px; font-size: 12px; font-weight: 600; background: none; color: var(--text-light); }
.speed-opt.active { background: var(--primary); color: white; }
.voice-name { font-size: 11px; color: var(--text-light); margin-top: 4px; }

.story-text { font-size: 16px; line-height: 1.7; margin: 12px 0; display: none; }
.story-text.visible { display: block; }

.dev-banner {
  background: #fff3e8; border: 2px solid var(--accent); border-radius: var(--radius-sm);
  padding: 10px 14px; margin-bottom: 16px; display: none;
  align-items: center; justify-content: space-between;
}
.dev-banner.visible { display: flex; }
.dev-banner-text { font-size: 13px; font-weight: 600; color: var(--accent); }
.dev-controls { display: none; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.dev-mode .dev-controls { display: flex; }
.dev-edit-panel {
  background: var(--accent-light); border: 2px solid var(--accent);
  border-radius: var(--radius-sm); padding: 16px; margin-top: 12px;
}
.dev-edit-panel label {
  font-size: 12px; font-weight: 600; color: var(--accent);
  display: block; margin: 10px 0 4px;
}
.dev-edit-panel label:first-child { margin-top: 0; }
.dev-edit-panel input, .dev-edit-panel textarea {
  width: 100%; padding: 8px 10px; font-size: 14px;
  border: 2px solid #f0d0a8; border-radius: 6px; background: white;
}
.dev-edit-panel textarea { min-height: 60px; resize: vertical; }
.dev-add-btn {
  width: 100%; padding: 14px; margin-top: 12px;
  border: 2px dashed var(--accent); border-radius: var(--radius);
  background: var(--accent-light); color: var(--accent);
  font-size: 14px; font-weight: 600; display: none;
}
.dev-mode .dev-add-btn { display: block; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 1000; display: none; align-items: center;
  justify-content: center; padding: 20px;
}
.modal-overlay.visible { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius);
  padding: 24px; max-width: 360px; width: 100%; box-shadow: var(--shadow-lg);
}
.modal h3 { font-family: 'Outfit', sans-serif; font-size: 18px; margin-bottom: 12px; }
.modal input {
  width: 100%; padding: 12px; font-size: 16px;
  border: 2px solid var(--border); border-radius: var(--radius-sm);
  text-align: center; letter-spacing: 4px; margin-bottom: 12px;
}
.modal .btn-group { justify-content: flex-end; }

.reset-section {
  margin-top: 24px; padding-top: 16px;
  border-top: 1px solid var(--border); text-align: center;
}
.btn-reset {
  background: none; color: var(--text-light); font-size: 13px;
  font-weight: 500; padding: 8px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.btn-reset:hover { color: var(--wrong); border-color: var(--wrong); }
.btn-reset.confirm { color: white; background: var(--wrong); border-color: var(--wrong); }

.dev-data-section {
  margin-top: 16px; padding-top: 16px;
  border-top: 1px dashed var(--accent); display: none;
}
.dev-mode .dev-data-section { display: block; }

@media (max-width: 400px) {
  .header h1 { font-size: 18px; }
  .tab { font-size: 11px; padding: 12px 4px 10px; }
  .selectable-sentence { font-size: 16px; }
  .sentence-text { font-size: 15px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Relative Clause Trainer</h1>
  <p>who · which · that</p>
  <div class="header-actions">
    <button class="btn-icon" id="devToggle" title="Developer Mode" onclick="toggleDevMode()">&#9881;</button>
  </div>
</div>

<div class="tabs" id="tabBar"></div>

<div class="main" id="mainArea">
  <div class="dev-banner" id="devBanner">
    <span class="dev-banner-text">&#9888; Developer Mode Active</span>
    <button class="btn btn-sm btn-accent" onclick="toggleDevMode()">Exit</button>
  </div>
  <div class="exercise" id="ex1"></div>
  <div class="exercise" id="ex2"></div>
  <div class="exercise" id="ex3"></div>
  <div class="exercise" id="ex4"></div>
  <div class="reset-section">
    <button class="btn-reset" id="resetBtn" onclick="handleReset()">Reset All Progress</button>
  </div>
  <div class="dev-data-section">
    <div class="btn-group" style="justify-content:center;">
      <button class="btn btn-sm btn-outline" onclick="exportData()">Export JSON</button>
      <button class="btn btn-sm btn-outline" onclick="importData()">Import JSON</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pwModal">
  <div class="modal">
    <h3>Enter Developer Password</h3>
    <input type="password" id="pwInput" maxlength="10" placeholder="••••" onkeydown="if(event.key==='Enter')checkPassword()">
    <div class="btn-group">
      <button class="btn btn-outline btn-sm" onclick="closePwModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="checkPassword()">Enter</button>
    </div>
  </div>
</div>

<script>
var DEFAULT_DATA = {
  exercise1: [
    { id:"1a", en:"The boy who lives next door plays football.", uz:"Qo'shni bola futbol o'ynaydi.", clause:"who lives next door", type:"subject" },
    { id:"1b", en:"I have a friend who speaks three languages.", uz:"Mening uch tilda gaplashadigan do'stim bor.", clause:"who speaks three languages", type:"subject" },
    { id:"1c", en:"The teacher who teaches us English is very kind.", uz:"Bizga ingliz tilini o'rgatadigan o'qituvchi juda mehribon.", clause:"who teaches us English", type:"subject" },
    { id:"1d", en:"The woman who works at the hospital called me yesterday.", uz:"Kasalxonada ishlaydigan ayol menga kecha qo'ng'iroq qildi.", clause:"who works at the hospital", type:"subject" },
    { id:"1e", en:"Students who study hard every day usually get good results.", uz:"Har kuni qattiq o'qiydigan talabalar odatda yaxshi natijalarga erishadi.", clause:"who study hard every day", type:"subject" },
    { id:"1f", en:"The book that I read was very interesting.", uz:"Men o'qigan kitob juda qiziqarli edi.", clause:"that I read", type:"object" },
    { id:"1g", en:"The cake which my mother made was delicious.", uz:"Onam tayyorlagan tort juda mazali edi.", clause:"which my mother made", type:"object" },
    { id:"1h", en:"The movie that we watched last night was very funny.", uz:"Kecha kechqurun ko'rgan filmimiz juda kulgili edi.", clause:"that we watched last night", type:"object" },
    { id:"1i", en:"The phone that I bought last month is already broken.", uz:"O'tgan oy sotib olgan telefonim allaqachon buzilgan.", clause:"that I bought last month", type:"object" },
    { id:"1j", en:"The people that she invited to the party were all very friendly.", uz:"Uning ziyofatga taklif qilgan odamlari hammasi juda samimiy edi.", clause:"that she invited to the party", type:"object" }
  ],
  exercise2: [
    { id:"2a", en:"The girl who sits next to me is very smart.", s1:"The girl is very smart.", s2:"The girl sits next to me.", type:"subject" },
    { id:"2b", en:"The dog that barks every night keeps everyone awake.", s1:"The dog keeps everyone awake.", s2:"The dog barks every night.", type:"subject" },
    { id:"2c", en:"I know a man who can fix any computer.", s1:"I know a man.", s2:"He can fix any computer.", type:"subject" },
    { id:"2d", en:"The bus which goes to the city centre is always crowded.", s1:"The bus is always crowded.", s2:"The bus goes to the city centre.", type:"subject" },
    { id:"2e", en:"The student who answered all the questions got the highest mark.", s1:"The student got the highest mark.", s2:"The student answered all the questions.", type:"subject" },
    { id:"2f", en:"The letter that she wrote was very long.", s1:"The letter was very long.", s2:"She wrote the letter.", type:"object" },
    { id:"2g", en:"The food which he cooked for us was delicious.", s1:"The food was delicious.", s2:"He cooked the food for us.", type:"object" },
    { id:"2h", en:"The place that we visited last summer was beautiful.", s1:"The place was beautiful.", s2:"We visited the place last summer.", type:"object" },
    { id:"2i", en:"The keys which I lost yesterday were in my bag.", s1:"The keys were in my bag.", s2:"I lost the keys yesterday.", type:"object" },
    { id:"2j", en:"The song that they played at the concert was amazing.", s1:"The song was amazing.", s2:"They played the song at the concert.", type:"object" }
  ],
  exercise3: [
    { id:"3a", s1:"The woman is a doctor.", s2:"She lives across the street.", combined:"The woman who lives across the street is a doctor.", type:"subject" },
    { id:"3b", s1:"The car belongs to my teacher.", s2:"It is parked outside.", combined:"The car which is parked outside belongs to my teacher.", type:"subject" },
    { id:"3c", s1:"I met a boy.", s2:"He wants to become a pilot.", combined:"I met a boy who wants to become a pilot.", type:"subject" },
    { id:"3d", s1:"The shop is closed today.", s2:"It sells fresh bread.", combined:"The shop which sells fresh bread is closed today.", type:"subject" },
    { id:"3e", s1:"The old man lives alone.", s2:"He sits in the park every morning.", combined:"The old man who sits in the park every morning lives alone.", type:"subject" },
    { id:"3f", s1:"The present was a book.", s2:"I got it for my birthday.", combined:"The present that I got for my birthday was a book.", type:"object" },
    { id:"3g", s1:"The film was very long.", s2:"We saw it at the cinema.", combined:"The film that we saw at the cinema was very long.", type:"object" },
    { id:"3h", s1:"The homework was really difficult.", s2:"The teacher gave it to us.", combined:"The homework that the teacher gave to us was really difficult.", type:"object" },
    { id:"3i", s1:"The dress is too small now.", s2:"My sister bought it last year.", combined:"The dress that my sister bought last year is too small now.", type:"object" },
    { id:"3j", s1:"The story was about a brave girl.", s2:"My grandfather told it to me.", combined:"The story that my grandfather told me was about a brave girl.", type:"object" }
  ],
  exercise4: [
    { id:"4a", story:"I have a neighbour. The neighbour who lives above us plays loud music at night. We cannot sleep because of him.", uz:"Mening qo'shnim bor. Ustimizda yashaydigan qo'shni kechasi baland musiqa tinglaydi. Biz uning tufayli uxlay olmaymiz.", type:"subject" },
    { id:"4b", story:"Last week a new student joined our class. The student who came from Samarkand is very good at maths. Everyone likes him.", uz:"O'tgan hafta sinfimizga yangi o'quvchi qo'shildi. Samarqanddan kelgan o'quvchi matematikadan juda yaxshi. Uni hamma yaxshi ko'radi.", type:"subject" },
    { id:"4c", story:"My family has a small garden. The tree which grows in the middle gives us apples every autumn. We make jam from them.", uz:"Bizning oilamizning kichik bog'i bor. O'rtada o'sadigan daraxt har kuzda bizga olma beradi. Biz ulardan murabbo tayyorlaymiz.", type:"subject" },
    { id:"4d", story:"There is a bakery near our school. The woman who owns the bakery makes the best somsa in town. Students always go there after classes.", uz:"Maktabimiz yonida novvoyxona bor. Novvoyxona egasi bo'lgan ayol shahardagi eng mazali somsani tayyorlaydi. O'quvchilar darsdan keyin doim u yerga borishadi.", type:"subject" },
    { id:"4e", story:"Yesterday was my birthday. The gift that my best friend gave me was a beautiful notebook. I will use it for my English lessons.", uz:"Kecha mening tug'ilgan kunim edi. Eng yaqin do'stim menga bergan sovg'a chiroyli daftar edi. Uni ingliz tili darslarim uchun ishlataman.", type:"object" },
    { id:"4f", story:"We went to a restaurant last weekend. The plov which the chef cooked was the best I have ever tasted. I want to go there again.", uz:"O'tgan dam olish kuni restoranga bordik. Oshpaz tayyorlagan palov men tatib ko'rgan eng mazali palov edi. Yana u yerga bormoqchiman.", type:"object" },
    { id:"4g", story:"My sister loves reading. The book that she is reading now is about space travel. She wants to become an astronaut one day.", uz:"Singlim kitob o'qishni yaxshi ko'radi. U hozir o'qiyotgan kitob kosmik sayohat haqida. U bir kun kosmonavt bo'lmoqchi.", type:"object" },
    { id:"4h", story:"I watched a video on YouTube. The video that my teacher recommended was about animals in Africa. I learned many new English words from it.", uz:"Men YouTubeda video tomasho qildim. O'qituvchim tavsiya qilgan video Afrikadagi hayvonlar haqida. Undan ko'p yangi inglizcha so'zlarni o'rgandim.", type:"object" }
  ]
};

var STORAGE_KEY = "rc_trainer_v2";
var state = {
  currentEx: 1,
  currentIdx: { 1:0, 2:0, 3:0, 4:0 },
  progress: { 1:{}, 2:{}, 3:{}, 4:{} },
  devMode: false, data: null, editingId: null,
  speed: 1, resetStep: 0
};
var TAB_NAMES = ["1. Translate", "2. Split", "3. Combine", "4. Listen"];
var EX_KEYS = ["exercise1","exercise2","exercise3","exercise4"];
var bestVoice = null;

function init() { loadState(); initVoices(); renderTabs(); switchExercise(state.currentEx); }

function loadState() {
  try {
    var s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s) {
      if (s.progress) state.progress = s.progress;
      if (s.currentIdx) state.currentIdx = s.currentIdx;
      if (s.data) state.data = s.data;
      if (s.speed) state.speed = s.speed;
    }
  } catch(e) {}
  if (!state.data) state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      progress:state.progress, currentIdx:state.currentIdx, data:state.data, speed:state.speed
    }));
  } catch(e) {}
}

// ---- VOICE SELECTION: prioritize cloud/high-quality voices ----
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  var pick = function() {
    var v = speechSynthesis.getVoices();
    if (!v.length) return;
    var us = v.filter(function(x){return x.lang==='en-US';});
    var en = v.filter(function(x){return x.lang.startsWith('en');});
    // Tier 1: cloud voices (Google, Microsoft Online, Neural, Natural)
    bestVoice = us.find(function(x){
      var n=x.name.toLowerCase();
      return !x.localService && (n.indexOf('google')!==-1||n.indexOf('online')!==-1||n.indexOf('neural')!==-1||n.indexOf('natural')!==-1);
    });
    // Tier 2: any cloud en-US
    if(!bestVoice) bestVoice = us.find(function(x){return !x.localService;});
    // Tier 3: named quality local voices
    if(!bestVoice) bestVoice = us.find(function(x){
      var n=x.name.toLowerCase();
      return n.indexOf('samantha')!==-1||n.indexOf('enhanced')!==-1||n.indexOf('premium')!==-1;
    });
    // Tier 4: any local en-US
    if(!bestVoice) bestVoice = us[0];
    // Tier 5: any English
    if(!bestVoice) bestVoice = en[0];
  };
  pick();
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = pick;
  setTimeout(pick, 200);
}

// ---- TABS ----
function renderTabs() {
  var bar = document.getElementById("tabBar"); bar.innerHTML = "";
  for (var i=1;i<=4;i++) {
    (function(n){
      var t=document.createElement("button");
      t.className="tab"+(state.currentEx===n?" active":"");
      var items=state.data[EX_KEYS[n-1]], d=0;
      items.forEach(function(x){if(state.progress[n][x.id])d++;});
      t.innerHTML=TAB_NAMES[n-1]+'<span class="tab-progress">'+d+'/'+items.length+'</span>';
      t.onclick=function(){switchExercise(n);};
      bar.appendChild(t);
    })(i);
  }
}

function switchExercise(n) {
  state.currentEx=n;
  for(var i=1;i<=4;i++) document.getElementById("ex"+i).className="exercise"+(i===n?" active":"");
  renderTabs(); renderCurrent();
}
function renderCurrent() {
  var n=state.currentEx;
  if(n===1)renderEx1();else if(n===2)renderEx2();else if(n===3)renderEx3();else renderEx4();
}

// ---- NAV ----
function buildNav(ex,items) {
  var i=state.currentIdx[ex];
  var h='<div class="nav-row">';
  h+='<button class="btn-nav" onclick="navTo('+ex+','+(i-1)+')"'+(i===0?' disabled':'')+'>&#8592;</button>';
  h+='<div class="nav-dots">';
  for(var j=0;j<items.length;j++){
    var c="nav-dot";if(j===i)c+=" active";if(state.progress[ex][items[j].id])c+=" done";
    h+='<button class="'+c+'" onclick="navTo('+ex+','+j+')"></button>';
  }
  h+='</div><button class="btn-nav" onclick="navTo('+ex+','+(i+1)+')"'+(i>=items.length-1?' disabled':'')+'>&#8594;</button></div>';
  return h;
}
function navTo(ex,i){
  var items=state.data[EX_KEYS[ex-1]];
  if(i<0||i>=items.length)return;
  state.currentIdx[ex]=i; saveState(); renderCurrent();
}
function markDone(ex,id){ state.progress[ex][id]=true; saveState(); renderTabs(); renderCurrent(); }
function markUndone(ex,id){ delete state.progress[ex][id]; saveState(); renderTabs(); renderCurrent(); }
function clampIdx(ex,items){
  var i=state.currentIdx[ex];
  if(i>=items.length)i=items.length-1; if(i<0)i=0;
  state.currentIdx[ex]=i; return i;
}

// ============================================================
// EXERCISE 1: Translate & Highlight (native text selection)
// ============================================================
function renderEx1() {
  var items=state.data.exercise1, idx=clampIdx(1,items), item=items[idx], done=state.progress[1][item.id];
  var h='<div class="exercise-header"><div class="exercise-title">Translate & Highlight</div>';
  h+='<div class="exercise-counter">'+(idx+1)+' / '+items.length+'</div></div>';
  h+='<div class="card'+(done?' completed':'')+'">';
  h+='<div class="sentence-label">English Sentence <span class="sentence-type-badge '+(item.type==='subject'?'badge-subject':'badge-object')+'">'+item.type+' RC</span></div>';
  h+='<p class="highlight-instruction">Select the relative clause text, then tap "Highlight Selection"</p>';
  h+='<div class="selectable-sentence" id="ex1Sentence">'+escHtml(item.en)+'</div>';
  h+='<div class="btn-group">';
  h+='<button class="btn btn-accent btn-sm" onclick="highlightSel()">&#9998; Highlight Selection</button>';
  h+='<button class="btn btn-outline btn-sm" onclick="clearHL()">Clear</button>';
  h+='</div><div class="btn-group">';
  h+='<button class="btn btn-secondary btn-sm" onclick="showCorrect1()">Show Correct Clause</button>';
  h+='<button class="btn btn-primary btn-sm" onclick="showTrans1()">Show Translation</button>';
  h+='</div>';
  h+='<div class="answer-box" id="ex1Correct"></div>';
  h+='<div class="translation-box" id="ex1Trans">'+escHtml(item.uz)+'</div>';
  h+='<div class="self-assess" id="ex1Assess" style="display:none">';
  h+='<button class="btn-got-it" onclick="markDone(1,\''+item.id+'\')">&#10003; Got it</button>';

function highlightSel() {
  var container=document.getElementById('ex1Sentence');
  if(!container)return;
  var sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount)return;
  var range=sel.getRangeAt(0);
  if(!container.contains(range.startContainer)||!container.contains(range.endContainer))return;
  var txt=sel.toString().trim();
  if(!txt)return;
  try {
    var mark=document.createElement('mark');
    range.surroundContents(mark);
  } catch(e) {
    try {
      var frag=range.extractContents();
      var m2=document.createElement('mark');
      m2.appendChild(frag);
      range.insertNode(m2);
    } catch(e2){}
  }
  sel.removeAllRanges();
}

function clearHL() {
  var c=document.getElementById('ex1Sentence');
  if(!c)return;
  var item=state.data.exercise1[state.currentIdx[1]];
  c.innerHTML=escHtml(item.en);
}

function showCorrect1() {
  var item=state.data.exercise1[state.currentIdx[1]];
  var box=document.getElementById('ex1Correct');
  box.innerHTML='<strong>Relative clause:</strong> '+escHtml(item.clause);
  box.className='answer-box visible';
  // Highlight in sentence
  var c=document.getElementById('ex1Sentence');
  var full=item.en, cl=item.clause;
  var i=full.toLowerCase().indexOf(cl.toLowerCase());
  if(i!==-1){
    c.innerHTML=escHtml(full.substring(0,i))+'<mark class="correct-mark">'+escHtml(full.substring(i,i+cl.length))+'</mark>'+escHtml(full.substring(i+cl.length));
  }
  document.getElementById('ex1Assess').style.display='flex';
}

function showTrans1() {
  document.getElementById('ex1Trans').className='translation-box visible';
  document.getElementById('ex1Assess').style.display='flex';
}

// ============================================================
// EXERCISE 2: Split
// ============================================================
function renderEx2() {

  h+='<div class="answer-box" id="ex2a1">'+escHtml(item.s1)+'</div></div>';
  h+='<div class="input-group"><label>Sentence 2 (clause info)</label>';

  h+='<div class="self-assess" id="ex2Assess" style="display:none">';
  h+='<button class="btn-got-it" onclick="markDone(2,\''+item.id+'\')">&#10003; Got it</button>';
  h+='<button class="btn-not-quite" onclick="markUndone(2,\''+item.id+'\')">&#10007; Not quite</button></div>';

  h+='</div>'+buildNav(2,items)+buildDevAddBtn(2);

function showA2(n){ document.getElementById('ex2a'+n).className='answer-box visible'; document.getElementById('ex2Assess').style.display='flex'; }

// ============================================================
// EXERCISE 3: Combine
// ============================================================
function renderEx3() {
  var items=state.data.exercise3, idx=clampIdx(3,items), item=items[idx], done=state.progress[3][item.id];
  var h='<div class="exercise-header"><div class="exercise-title">Combine into One</div>';
  h+='<div class="exercise-counter">'+(idx+1)+' / '+items.length+'</div></div>';
  h+='<div class="card'+(done?' completed':'')+'">';
  h+='<div class="sentence-label">Two Sentences <span class="sentence-type-badge '+(item.type==='subject'?'badge-subject':'badge-object')+'">'+item.type+' RC</span></div>';
  h+='<div class="sentence-text">1. '+escHtml(item.s1)+'</div>';
  h+='<div class="sentence-text">2. '+escHtml(item.s2)+'</div>';
  h+='<div class="input-group"><label>Write one sentence using who / which / that</label>';
  h+='<textarea class="text-input" id="ex3input" rows="2" placeholder="Combine them into one sentence..."></textarea></div>';
  h+='<button class="btn btn-primary btn-sm" onclick="showA3()">Show Answer</button>';

  h+='<div class="self-assess" id="ex3Assess" style="display:none">';

  h+='</div>'+buildNav(3,items)+buildDevAddBtn(3);
  document.getElementById("ex3").innerHTML=h;

function showA3(){ document.getElementById('ex3answer').className='answer-box visible'; document.getElementById('ex3Assess').style.display='flex'; }

// ============================================================
// EXERCISE 4: Listening
// ============================================================
function renderEx4() {
  var items=state.data.exercise4, idx=clampIdx(4,items), item=items[idx], done=state.progress[4][item.id];
  var vName=bestVoice?bestVoice.name:'default';
  var h='<div class="exercise-header"><div class="exercise-title">Listen & Translate</div>';
  h+='<div class="exercise-counter">'+(idx+1)+' / '+items.length+'</div></div>';
  h+='<div class="card'+(done?' completed':'')+'">';
  h+='<div class="sentence-label">Listen to the story <span class="sentence-type-badge '+(item.type==='subject'?'badge-subject':'badge-object')+'">'+item.type+' RC</span></div>';
  h+='<div class="audio-controls">';
  h+='<button class="btn-play" onclick="playStory()">&#9654;</button>';
  h+='<div class="speed-toggle">';
  h+='<button class="speed-opt'+(state.speed===0.7?' active':'')+'" onclick="setSpd(0.7)">Slow</button>';
  h+='<button class="speed-opt'+(state.speed===1?' active':'')+'" onclick="setSpd(1)">Normal</button>';
  h+='</div></div>';
  h+='<div class="voice-name">Voice: '+escHtml(vName)+'</div>';
  h+='<div class="btn-group">';
  h+='<button class="btn btn-secondary btn-sm" onclick="showStoryTxt()">Show Text</button>';
  h+='<button class="btn btn-primary btn-sm" onclick="showStoryUz()">Show Translation</button>';
  h+='</div>';
  h+='<div class="story-text" id="ex4Text">'+escHtml(item.story)+'</div>';
  h+='<div class="translation-box" id="ex4Trans">'+escHtml(item.uz)+'</div>';
  h+='<div class="self-assess" id="ex4Assess" style="display:none">';
  h+='<button class="btn-got-it" onclick="markDone(4,\''+item.id+'\')">&#10003; Got it</button>';
  h+='<button class="btn-not-quite" onclick="markUndone(4,\''+item.id+'\')">&#10007; Not quite</button></div>';
  h+=buildDevControls(4,item,idx);
  h+='</div>'+buildNav(4,items)+buildDevAddBtn(4);
  document.getElementById("ex4").innerHTML=h;
}

function playStory() {
  var item=state.data.exercise4[state.currentIdx[4]];
  if(!item)return;
  speechSynthesis.cancel();
  setTimeout(function(){
    var u=new SpeechSynthesisUtterance(item.story);
    u.rate=state.speed; u.lang='en-US';
    if(bestVoice) u.voice=bestVoice;
    var ri=setInterval(function(){if(!speechSynthesis.speaking){clearInterval(ri);return;} speechSynthesis.resume();},3000);
    u.onend=function(){clearInterval(ri);}; u.onerror=function(){clearInterval(ri);};
    speechSynthesis.speak(u);
  },80);
}
function setSpd(s){ state.speed=s; saveState(); renderEx4(); }
function showStoryTxt(){ document.getElementById('ex4Text').className='story-text visible'; document.getElementById('ex4Assess').style.display='flex'; }
function showStoryUz(){ document.getElementById('ex4Trans').className='translation-box visible'; document.getElementById('ex4Assess').style.display='flex'; }

// ============================================================
// DEV MODE
// ============================================================
function toggleDevMode(){
  if(!state.devMode){
    document.getElementById('pwModal').className='modal-overlay visible';
    document.getElementById('pwInput').value='';
    setTimeout(function(){document.getElementById('pwInput').focus();},100);
  } else {
    state.devMode=false;
    document.getElementById('devToggle').className='btn-icon';
    document.getElementById('devBanner').className='dev-banner';
    document.getElementById('mainArea').classList.remove('dev-mode');
    state.editingId=null; renderCurrent();
  }
}
function closePwModal(){document.getElementById('pwModal').className='modal-overlay';}
function checkPassword(){
  if(document.getElementById('pwInput').value==='1111'){
    state.devMode=true; closePwModal();
    document.getElementById('devToggle').className='btn-icon dev-active';
    document.getElementById('devBanner').className='dev-banner visible';
    document.getElementById('mainArea').classList.add('dev-mode');
    renderCurrent();
  } else {
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').style.borderColor='#d45050';
    setTimeout(function(){document.getElementById('pwInput').style.borderColor='';},800);
  }
}

function buildDevControls(ex,item,idx){
  if(!state.devMode)return '';
  var h='<div class="dev-controls">';
  h+='<button class="btn btn-sm btn-accent" onclick="editItem('+ex+','+idx+')">&#9998; Edit</button>';
  h+='<button class="btn btn-sm btn-outline" style="color:#d45050;border-color:#d45050" onclick="deleteItem('+ex+','+idx+')">&#10005; Delete</button>';
  h+='</div>';
  if(state.editingId===ex+'-'+idx) h+=buildEditPanel(ex,item,idx);
  return h;
}
function buildDevAddBtn(ex){return '<button class="dev-add-btn" onclick="addItem('+ex+')">+ Add Sentence</button>';}
function editItem(ex,idx){state.editingId=ex+'-'+idx;renderCurrent();}

function buildEditPanel(ex,item,idx){
  var h='<div class="dev-edit-panel">';
  if(ex===1){
    h+='<label>English</label><input id="devEn" value="'+escAttr(item.en)+'">';
    h+='<label>Uzbek Translation</label><input id="devUz" value="'+escAttr(item.uz)+'">';
    h+='<label>Relative Clause Text (exact words from sentence)</label><input id="devClause" value="'+escAttr(item.clause)+'">';
    h+='<label>Type (subject / object)</label><input id="devType" value="'+escAttr(item.type)+'">';
  } else if(ex===2){
    h+='<label>Combined Sentence</label><input id="devEn" value="'+escAttr(item.en)+'">';
    h+='<label>Sentence 1 (main)</label><input id="devS1" value="'+escAttr(item.s1)+'">';
    h+='<label>Sentence 2 (clause info)</label><input id="devS2" value="'+escAttr(item.s2)+'">';
    h+='<label>Type (subject / object)</label><input id="devType" value="'+escAttr(item.type)+'">';
  } else if(ex===3){
    h+='<label>Sentence 1</label><input id="devS1" value="'+escAttr(item.s1)+'">';
    h+='<label>Sentence 2</label><input id="devS2" value="'+escAttr(item.s2)+'">';
    h+='<label>Combined Answer</label><input id="devCombined" value="'+escAttr(item.combined)+'">';
    h+='<label>Type (subject / object)</label><input id="devType" value="'+escAttr(item.type)+'">';
  } else {
    h+='<label>Story (2-3 sentences)</label><textarea id="devStory">'+escHtml(item.story)+'</textarea>';
    h+='<label>Uzbek Translation</label><textarea id="devUz">'+escHtml(item.uz)+'</textarea>';
    h+='<label>Type (subject / object)</label><input id="devType" value="'+escAttr(item.type)+'">';
  }
  h+='<div class="btn-group" style="margin-top:12px">';
  h+='<button class="btn btn-accent btn-sm" onclick="saveEdit('+ex+','+idx+')">Save</button>';
  h+='<button class="btn btn-outline btn-sm" onclick="cancelEdit()">Cancel</button>';
  h+='</div></div>';
  return h;
}

function saveEdit(ex,idx){
  var key=EX_KEYS[ex-1],item=state.data[key][idx];
  item.type=document.getElementById('devType').value.trim().toLowerCase()==='object'?'object':'subject';
  if(ex===1){item.en=document.getElementById('devEn').value.trim();item.uz=document.getElementById('devUz').value.trim();item.clause=document.getElementById('devClause').value.trim();}
  else if(ex===2){item.en=document.getElementById('devEn').value.trim();item.s1=document.getElementById('devS1').value.trim();item.s2=document.getElementById('devS2').value.trim();}
  else if(ex===3){item.s1=document.getElementById('devS1').value.trim();item.s2=document.getElementById('devS2').value.trim();item.combined=document.getElementById('devCombined').value.trim();}
  else{item.story=document.getElementById('devStory').value.trim();item.uz=document.getElementById('devUz').value.trim();}
  state.editingId=null; saveState(); renderCurrent();
}
function cancelEdit(){state.editingId=null;renderCurrent();}

function deleteItem(ex,idx){
  var key=EX_KEYS[ex-1];
  if(state.data[key].length<=1)return;
  delete state.progress[ex][state.data[key][idx].id];
  state.data[key].splice(idx,1);
  if(state.currentIdx[ex]>=state.data[key].length)state.currentIdx[ex]=state.data[key].length-1;
  saveState();renderTabs();renderCurrent();
}

function addItem(ex){
  var key=EX_KEYS[ex-1],nid=ex+'_'+Date.now(),item;
  if(ex===1)item={id:nid,en:"New sentence here.",uz:"Yangi gap.",clause:"relative clause",type:"subject"};
  else if(ex===2)item={id:nid,en:"New combined sentence.",s1:"Main sentence.",s2:"Second sentence.",type:"subject"};
  else if(ex===3)item={id:nid,s1:"First sentence.",s2:"Second sentence.",combined:"Combined sentence.",type:"subject"};
  else item={id:nid,story:"A short story with a relative clause.",uz:"Qisqa hikoya.",type:"subject"};
  state.data[key].push(item);
  state.currentIdx[ex]=state.data[key].length-1;
  state.editingId=ex+'-'+(state.data[key].length-1);
  saveState();renderTabs();renderCurrent();
}

// ---- RESET ----
function handleReset(){
  var btn=document.getElementById('resetBtn');
  if(state.resetStep===0){
    state.resetStep=1; btn.textContent='Tap again to confirm reset'; btn.className='btn-reset confirm';
    setTimeout(function(){state.resetStep=0;btn.textContent='Reset All Progress';btn.className='btn-reset';},3000);
  } else {
    state.progress={1:{},2:{},3:{},4:{}}; state.resetStep=0;
    btn.textContent='Reset All Progress';btn.className='btn-reset';
    saveState();renderTabs();renderCurrent();
  }
}

// ---- EXPORT / IMPORT ----
function exportData(){
  var b=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rc_trainer_data.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(ev){
      try{
        var p=JSON.parse(ev.target.result);
        if(p.exercise1&&p.exercise2&&p.exercise3&&p.exercise4){
          state.data=p;state.progress={1:{},2:{},3:{},4:{}};state.currentIdx={1:0,2:0,3:0,4:0};
          saveState();renderTabs();renderCurrent();
        }
      }catch(err){alert('Invalid JSON file');}
    };
    r.readAsText(f);
  };
  inp.click();
}

// ---- UTILS ----
function escHtml(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}
function escAttr(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):'';}

init();
</script>
